# @package _global_
training:
  epochs: 10
  learning_rate: 5e-5
  backbone_lr_ratio: 0.1
  weight_decay: 1e-5
  optimizer:
    name: adamw

  scheduler:
    name: cosine

  temperature: 4.0
  hard_loss_weight: 0.3
  soft_loss_weight: 0.7
  mixed_precision: true
  gradient_clip: 1.0
  resume_checkpoint: null