services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
      args:
        # If there is no TORCH_INDEX environment variable, default to the official PyTorch CPU index
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    container_name: deepfake-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs  # For model downloads
    environment:
      MODEL_NAME: convnext
      DEVICE: auto
      TRANSFORMERS_OFFLINE: "0"  # Allow downloading models
    restart: unless-stopped
    # Enable GPU support if available
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
    container_name: deepfake-frontend
    ports:
      - "7860:7860"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped