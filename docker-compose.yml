services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: deepfake-backend
    ports:
      - "8000:8000"
    volumes:
      # Gắn checkpoint từ máy host, không nhét vào image
      - ./checkpoints:/app/checkpoints:ro
    environment:
      MODEL_NAME: convnext
      CHECKPOINT_PATH: /app/checkpoints/convnext/best.pth
      DEVICE: auto
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
    container_name: deepfake-frontend
    ports:
      - "7860:7860"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped